name: Bundle size Base
on:
  push:
    branches: [master]

concurrency:
  # see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24.x

      - run: npm install

      - name: Build packages & create reports
        run: npm run bundle-size

      - name: Prepare report
        run: npx monosize upload-report --branch=master --commit-sha ${{ github.sha }} --report-files-glob="dist/bundle-size/monosize.json"

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monosize-report
          retention-days: 90
          if-no-files-found: error
          path: monosize-report.json
