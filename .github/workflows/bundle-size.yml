name: Bundle size
on:
  pull_request:

concurrency:
  # see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24.x

      - run: npm install

      - name: Build packages & create reports
        run: npm run bundle-size

      - name: Compare bundle size with base
        id: compare-remote
        run: |
          status=0
          npx monosize compare-reports --branch=${{ github.event.pull_request.base.ref }} --output=markdown --quiet > ./monosize-report.md --report-files-glob="dist/bundle-size/monosize.json" 2> ./monosize-error.log || status=$?
          cat ./monosize-error.log >&2

          if [ "$status" -ne 0 ] && grep -q "Artifact has expired" ./monosize-error.log; then
            echo "use-local-base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out base for local comparison
        if: steps.compare-remote.outputs.use-local-base == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bundle-size-base

      - name: Install base dependencies
        if: steps.compare-remote.outputs.use-local-base == 'true'
        run: npm install
        working-directory: .bundle-size-base

      - name: Build base bundle-size report
        if: steps.compare-remote.outputs.use-local-base == 'true'
        run: npm run bundle-size
        working-directory: .bundle-size-base

      - name: Compare bundle size with local base
        if: steps.compare-remote.outputs.use-local-base == 'true'
        run: npx monosize compare-reports --output=markdown --quiet > ./monosize-report.md --report-files-glob="dist/bundle-size/monosize.json"
        env:
          MONOSIZE_BASE_REPORT: ${{ github.workspace }}/.bundle-size-base/dist/bundle-size/monosize.json
          MONOSIZE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Save PR number
        run: echo ${{ github.event.number }} > pr.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monosize-report
          retention-days: 1
          if-no-files-found: error
          path: |
            monosize-report.md
            pr.txt
